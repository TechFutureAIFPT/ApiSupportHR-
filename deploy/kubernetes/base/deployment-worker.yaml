apiVersion: apps/v1
kind: Deployment
metadata:
  name: supporthr-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 900
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: worker
      containers:
        - name: worker
          image: supporthr-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.analysis_worker"]
          envFrom:
            - configMapRef:
                name: supporthr-backend-config
            - secretRef:
                name: supporthr-backend-secrets
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          startupProbe:
            exec:
              command: ["python", "-m", "app.workers.healthcheck"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["python", "-m", "app.workers.healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-m", "app.workers.healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
