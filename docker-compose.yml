services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - supporthr

  backend:
    image: supporthr-backend:local
    build:
      context: ./api_server
      dockerfile: Dockerfile
    env_file:
      - ./api_server/.env
    environment:
      PORT: "8000"
      REDIS_INTERNAL_URL: redis://redis:6379/0
      ANALYSIS_JOB_MODE: redis
      AUTH_PROVIDER: ${AUTH_PROVIDER:-firebase}
      DATA_PROVIDER: ${DATA_PROVIDER:-firestore}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()\""
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - supporthr

  worker:
    image: supporthr-backend:local
    env_file:
      - ./api_server/.env
    environment:
      REDIS_INTERNAL_URL: redis://redis:6379/0
      ANALYSIS_JOB_MODE: redis
      AUTH_PROVIDER: ${AUTH_PROVIDER:-firebase}
      DATA_PROVIDER: ${DATA_PROVIDER:-firestore}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    command: ["python", "-m", "app.workers.analysis_worker"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - supporthr

volumes:
  redis-data:

networks:
  supporthr:
    driver: bridge
