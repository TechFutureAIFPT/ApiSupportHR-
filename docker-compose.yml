services:
  backend:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    container_name: hipo-tools-backend
    env_file:
      - ./api_server/.env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
