services:
  - type: web
    name: backendsupporthr
    runtime: python
    plan: free
    region: singapore
    rootDir: api_server
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_NAME
        value: SupportHR Backend
      - key: MAINTENANCE_MODE
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_CV_ANALYSIS_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: GEMINI_EMBEDDING_DIMENSION
        value: "768"
      - key: VECTOR_INDEX_VERSION
        value: gemini-embedding-2-768-v1
      - key: ANALYSIS_JOB_MODE
        value: in_process
      - key: LOCAL_CLASSIFIER_MODE
        value: local
      - key: REQUIRE_CLASSIFIER_READY
        value: "true"
      - key: POSTGRES_POOL_MIN_SIZE
        value: "1"
      - key: POSTGRES_POOL_MAX_SIZE
        value: "5"
      - key: AI_PREPROCESS_CONCURRENCY
        value: "1"
      - key: RAG_CANDIDATE_LIMIT
        value: "50"
