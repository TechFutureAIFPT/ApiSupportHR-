services:
  - type: web
    name: backendsupporthr
    runtime: python
    plan: free
    rootDir: api_server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_NAME
        value: SupportHR Backend
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_DRIVE_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_PICKER_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_CV_ANALYSIS_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_MEASUREMENT_ID
        sync: false
      - key: FIREBASE_APPCHECK_SITE_KEY
        sync: false
      - key: VECTOR_STORE_PROVIDER
        value: auto
      - key: VECTOR_STORE_JSON_DIR
        sync: false
      - key: VECTOR_STORE_FIRESTORE_COLLECTION
        value: vectorLibraryRecords
      - key: APPROVED_EXEMPLARS_COLLECTION
        value: approvedExemplars
      - key: RUBRIC_VERSION
        value: v1
      - key: LOCAL_CLASSIFIER_MODE
        value: local
      - key: LOCAL_CLASSIFIER_REMOTE_CLASSIFY_URL
        sync: false
      - key: LOCAL_CLASSIFIER_REMOTE_STATUS_URL
        sync: false
      - key: LOCAL_CLASSIFIER_REMOTE_TIMEOUT_SECONDS
        value: "10"
      - key: LOCAL_CLASSIFIER_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.75"
      - key: RAG_MAX_EXEMPLARS
        value: "2"
