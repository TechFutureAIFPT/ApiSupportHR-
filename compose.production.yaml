name: supporthr

x-backend-common: &backend-common
  image: ${SUPPORTHR_IMAGE_REF:-ghcr.io/techfutureaifpt/supporthr-backend:main}
  env_file:
    - ${SUPPORTHR_ENV_FILE:-./deploy/vps/runtime.env}
  environment:
    REDIS_URL: redis://redis:6379/0
    REDIS_INTERNAL_URL: redis://redis:6379/0
    ANALYSIS_JOB_MODE: redis
  restart: unless-stopped
  networks:
    - supporthr-internal
  logging: &default-logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - supporthr-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 768m
    cpus: 0.50
    logging: *default-logging

  backend:
    <<: *backend-common
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5
    stop_grace_period: 120s
    mem_limit: 3g
    cpus: 1.00

  worker:
    <<: *backend-common
    command: ["python", "-m", "app.workers.analysis_worker"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    stop_grace_period: 900s
    mem_limit: 5g
    cpus: 1.50

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/vps/runtime.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/vps/runtime.env}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - supporthr-internal
    logging: *default-logging

networks:
  supporthr-internal:
    name: supporthr-internal

volumes:
  redis-data:
    name: supporthr-redis-data
  caddy-data:
    name: supporthr-caddy-data
  caddy-config:
    name: supporthr-caddy-config
